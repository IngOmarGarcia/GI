# ---------------------------------------------------------------------------
# Render Blueprint · Pasarela de diagnóstico SAT del sistema SIGCF
#
# Despliega el servicio `sat-gateway/` como Web Service con HTTPS.
# El SPA vive en Netlify (https://gi-gestion.netlify.app) y sólo puede llamar a
# esta pasarela si viaja por HTTPS: un origen https:// no puede pedir a http://.
#
# Uso:  Render → New → Blueprint → seleccionar el repositorio IngOmarGarcia/GI
#       Render lee este archivo y crea el servicio automáticamente.
# ---------------------------------------------------------------------------
services:
  - type: web
    name: sigcf-sat-gateway
    runtime: node
    plan: free
    region: oregon

    # El repositorio contiene el SPA en la raíz y la pasarela en un subdirectorio.
    rootDir: sat-gateway

    # `npm install` en lugar de `npm ci`: este ultimo aborto el build en Render
    # con estatus 254. `npm install` resuelve el arbol de dependencias aunque el
    # lockfile no encaje exactamente con el entorno del build.
    # El lockfile sigue versionado, asi que las versiones instaladas coinciden
    # con las verificadas mientras no cambien los rangos de package.json.
    buildCommand: npm install
    startCommand: node server.js

    # Render consulta esta ruta para decidir si enruta tráfico al servicio.
    # Debe responder de inmediato y sin depender de terceros: si apuntara a
    # /api/sat/salud, que consulta los cuatro endpoints del SAT, una lentitud
    # de la red del SAT bastaría para tumbar el despliegue completo.
    healthCheckPath: /healthz

    # Sólo se despliega cuando cambia la pasarela. Un cambio en index.html
    # (que es lo que publica Netlify) no dispara un redeploy aquí.
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - sat-gateway/**
        - render.yaml

    envVars:
      # Node 20 LTS. Entre comillas para que YAML lo entregue como cadena y no
      # como número: Render espera texto en los valores de envVars.
      # El servicio sólo usa APIs disponibles desde Node 18 (X509Certificate,
      # fetch, FormData, Blob, AbortController), así que 20 es suficiente.
      - key: NODE_VERSION
        value: "20"

      # Orígenes autorizados a llamar a la pasarela, separados por coma.
      # Restringido al dominio real del SPA: evita que cualquier página de
      # internet use esta pasarela como intermediaria hacia el SAT.
      # Para habilitar los deploy previews de Netlify, añada por ejemplo:
      #   https://gi-gestion.netlify.app,https://deploy-preview-1--gi-gestion.netlify.app
      - key: CORS_ORIGIN
        value: https://gi-gestion.netlify.app

    # NOTA SOBRE EL PLAN FREE
    # Render suspende los servicios gratuitos tras ~15 minutos sin tráfico. La
    # primera petición después de una pausa tarda cerca de un minuto en
    # responder mientras el contenedor arranca. Por eso el SPA usa un timeout de
    # 90 s y conviene pulsar «Probar alcance» antes del diagnóstico: esa llamada
    # despierta el servicio sin enviar credencial alguna.
    # Un plan de pago elimina la suspensión.
